<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>【典例3】简易起重装置（B点受力 + 平行四边形 + 相似三角形）</title>
<style>
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f7f7f2;
       display:flex;flex-direction:column;align-items:center;margin:0;padding:14px;}
  h3{margin:6px 0 10px;}
  svg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);border-radius:8px;}
  .panel{margin:12px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;
         background:#fff;padding:10px 18px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.12);}
  input[type=range]{width:280px;}
  button{padding:6px 16px;cursor:pointer;border:1px solid #888;border-radius:5px;background:#eee;}
  button:hover{background:#ddd;}
  #info{background:#fff;padding:8px 20px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.12);
        font-size:15px;line-height:1.7;text-align:center;max-width:920px;}
  .fn{color:#d0342c;font-weight:bold;} .ft{color:#1e66d0;font-weight:bold;}
</style>
</head>
<body>

<h3>【典例3】简易起重装置 —— B点受力 + 平行四边形合力 + 相似三角形（可调节）</h3>

<svg id="scene" width="900" height="830" viewBox="0 0 900 830">
  <defs>
    <marker id="arrG" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"
            markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#2e8b57"/></marker>
    <marker id="arrT" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"
            markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1e66d0"/></marker>
    <marker id="arrN" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"
            markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#d0342c"/></marker>
    <marker id="arrR" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"
            markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#7a4fa0"/></marker>
  </defs>

  <!-- 地面 -->
  <line x1="60" y1="615" x2="650" y2="615" stroke="#333" stroke-width="2.5"/>
  <g id="hatch" stroke="#555" stroke-width="1.5"></g>

  <!-- 固定支架竖杆 + 几何边 AC（绿，对应 G） -->
  <line x1="360" y1="90" x2="360" y2="615" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="360" y1="90" x2="360" y2="310" stroke="#2e8b57" stroke-width="4"/>

  <!-- 卷扬机 -->
  <line x1="152" y1="575" x2="144" y2="615" stroke="#333" stroke-width="3"/>
  <line x1="168" y1="575" x2="176" y2="615" stroke="#333" stroke-width="3"/>
  <circle cx="160" cy="562" r="14" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <circle cx="160" cy="562" r="3" fill="#333"/>

  <!-- 杆 BC（红，几何边 BC，对应 Fₙ） -->
  <line id="rod" x1="360" y1="310" x2="480" y2="424" stroke="#d0342c" stroke-width="7" stroke-linecap="round"/>
  <!-- 钢丝绳：卷扬机→A（黑）；A→B（蓝，几何边 AB，对应 F） -->
  <line id="rope1" x1="160" y1="548" x2="360" y2="98" stroke="#333" stroke-width="1.8"/>
  <line id="rope2" x1="360" y1="98" x2="480" y2="424" stroke="#1e66d0" stroke-width="2.2"/>

  <!-- 滑轮 A 与铰链 C -->
  <circle cx="360" cy="90" r="11" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <circle cx="360" cy="90" r="2.5" fill="#222"/>
  <circle cx="360" cy="310" r="5.5" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="340" y="76" font-size="19" font-weight="bold">A</text>
  <text x="332" y="318" font-size="19" font-weight="bold">C</text>

  <!-- ∠BCA 弧 -->
  <path id="arc" d="" fill="none" stroke="#c47f17" stroke-width="1.6"/>
  <text id="arcTxt" font-size="15" fill="#c47f17" font-weight="bold"></text>

  <!-- 重物 m -->
  <line id="wLine" x1="480" y1="424" x2="480" y2="466" stroke="#333" stroke-width="1.8"/>
  <rect id="wBox" x="463" y="466" width="34" height="36" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text id="wTxt" font-size="19" font-style="italic" font-weight="bold">m</text>
  <text id="lblB" font-size="19" font-weight="bold">B</text>

  <!-- ===== B 点受力（全部从 B 出发、沿真实方向） + 平行四边形 ===== -->
  <g id="forces">
    <line id="pSide1" stroke="#7a4fa0" stroke-width="1.6" stroke-dasharray="6 4"/>
    <line id="pSide2" stroke="#7a4fa0" stroke-width="1.6" stroke-dasharray="6 4"/>
    <line id="pCas" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <line id="pDiag" stroke="#7a4fa0" stroke-width="3" marker-end="url(#arrR)"/>
    <text id="pRt" font-size="14" fill="#7a4fa0" font-weight="bold">R = −F</text>
    <line id="cG" stroke="#fff" stroke-width="6.5" stroke-linecap="round" opacity="0.85"/>
    <line id="cT" stroke="#fff" stroke-width="6.5" stroke-linecap="round" opacity="0.85"/>
    <line id="cN" stroke="#fff" stroke-width="6.5" stroke-linecap="round" opacity="0.85"/>
    <line id="fG" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrG)"/>
    <line id="fT" stroke="#1e66d0" stroke-width="3" marker-end="url(#arrT)"/>
    <line id="fN" stroke="#d0342c" stroke-width="3" marker-end="url(#arrN)"/>
    <text id="fGt" font-size="16" fill="#2e8b57" font-weight="bold" text-anchor="end">G</text>
    <text id="fTt" font-size="16" fill="#1e66d0" font-weight="bold" text-anchor="middle">F</text>
    <text id="fNt" font-size="16" fill="#d0342c" font-weight="bold" text-anchor="start">F&#8345;</text>
  </g>

  <!-- ===== 右侧：相似三角形对照（上下两个独立分区） ===== -->
  <text x="772" y="42" font-size="15.5" font-weight="bold" fill="#333" text-anchor="middle">力三角形 ∽ 几何三角形 ABC</text>
  <text x="772" y="64" font-size="12.5" fill="#888" text-anchor="middle">同色边互相平行，长度对应成比例</text>
  <line x1="655" y1="78" x2="892" y2="78" stroke="#ddd" stroke-width="1"/>
  <text x="772" y="102" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">几何三角形 ABC</text>

  <line x1="720" y1="120" x2="720" y2="212" stroke="#2e8b57" stroke-width="3"/>
  <line id="gAB" x1="720" y1="120" x2="770" y2="160" stroke="#1e66d0" stroke-width="3"/>
  <line id="gBC" x1="770" y1="160" x2="720" y2="212" stroke="#d0342c" stroke-width="3"/>
  <text x="712" y="170" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="end">AC=220</text>
  <text id="gABt" font-size="12.5" fill="#1e66d0" font-weight="bold"></text>
  <text id="gBCt" font-size="12.5" fill="#d0342c" font-weight="bold"></text>
  <text id="gAt" font-size="13" font-weight="bold" text-anchor="end">A</text>
  <text id="gCt" font-size="13" font-weight="bold" text-anchor="end">C</text>
  <text id="gBt" font-size="13" font-weight="bold">B</text>

  <line x1="655" y1="335" x2="892" y2="335" stroke="#ddd" stroke-width="1"/>
  <text x="772" y="360" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">力的矢量三角形（B 点三力平衡）</text>

  <g id="ftri">
    <line id="pG" x1="720" y1="400" x2="720" y2="480" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrG)"/>
    <line id="pN" x1="720" y1="480" x2="783" y2="550" stroke="#d0342c" stroke-width="3" marker-end="url(#arrN)"/>
    <line id="pF" x1="783" y1="550" x2="720" y2="400" stroke="#1e66d0" stroke-width="3" marker-end="url(#arrT)"/>
    <text id="pGt" font-size="13" fill="#2e8b57" font-weight="bold">G=mg</text>
    <text id="pNt" font-size="13" fill="#d0342c" font-weight="bold">F&#8345;</text>
    <text id="pFt" font-size="13" fill="#1e66d0" font-weight="bold">F</text>
  </g>

  <!-- 相似比例公式 -->
  <text x="655" y="652" font-size="12.5" fill="#333">∵ G∥AC、F∥AB、F&#8345;∥BC（同色）</text>
  <text x="655" y="674" font-size="12.5" fill="#333">∴ 力三角形 ∽ △ABC，且</text>
  <text x="655" y="700" font-size="15" font-weight="bold" fill="#8a5a00">G/AC = F/AB = F&#8345;/BC</text>
  <text id="ftVal1" x="655" y="726" font-size="12.5" fill="#333"></text>
  <text id="ftVal2" x="655" y="748" font-size="12.5" fill="#333"></text>
  <text x="655" y="772" font-size="11.5" fill="#7a4fa0">R=G+F&#8345;=−F（与F等大反向）</text>
</svg>

<div class="panel">
  <label>∠BCA = <b id="angVal">120°</b></label>
  <input type="range" id="slider" min="40" max="140" value="120" step="0.5">
  <label><input type="checkbox" id="showF" checked> 显示 B 点受力与平行四边形</label>
  <button id="play">▶ 演示缓慢变小</button>
</div>

<div id="info"></div>

<script>
const NS="http://www.w3.org/2000/svg";
const Ax=360, Ay=90, Cx=360, Cy=310;
const AC=220, BC=270, S=80;                  // S：80px 表示 mg
const NL=S*BC/AC;                            // Fₙ 长度（恒定 98.2）
/* 右侧几何三角形映射（上分区 y≤300）与力三角形锚点（下分区 y≥400） */
const GX=x=>720+(x-360)*0.42, GY=y=>120+(y-90)*0.42;
const PAx=720, PAy=400, V1y=480;             // 力三角形：G 边从 (720,400) 到 (720,480)

const $=id=>document.getElementById(id);
const nrm=(x,y)=>{const l=Math.hypot(x,y)||1;return[x/l,y/l];};

// 地面阴影
(()=>{let g=$('hatch');for(let x=72;x<=645;x+=18){
  const l=document.createElementNS(NS,'line');
  l.setAttribute('x1',x);l.setAttribute('y1',615);
  l.setAttribute('x2',x-11);l.setAttribute('y2',627);g.appendChild(l);} })();
// 卷扬机下小阴影
(()=>{let g=$('hatch');for(let x=136;x<=186;x+=13){
  const l=document.createElementNS(NS,'line');
  l.setAttribute('x1',x);l.setAttribute('y1',615);
  l.setAttribute('x2',x-9);l.setAttribute('y2',624);g.appendChild(l);} })();

/* 顶点标签：沿"质心→顶点"方向外推，任何形状都不会压线 */
function vLabel(elm,V,Ctr){
  const [ux,uy]=nrm(V[0]-Ctr[0],V[1]-Ctr[1]);
  elm.setAttribute('x',V[0]+ux*15+(ux>=0?3:-3));
  elm.setAttribute('y',V[1]+uy*15+4);
  elm.setAttribute('text-anchor',ux>=0?'start':'end');
}
/* 边标签：沿"质心→边中点"的外法线方向偏移，不压边线 */
function eLabel(elm,P,Q,Ctr){
  const mx=(P[0]+Q[0])/2, my=(P[1]+Q[1])/2;
  let [ux,uy]=nrm(Ctr[0]-mx,Ctr[1]-my);      // 指向质心 = 内侧
  ux=-ux;uy=-uy;                              // 取外侧
  elm.setAttribute('x',mx+ux*17);
  elm.setAttribute('y',my+uy*17+4);
  elm.setAttribute('text-anchor',ux>=0?'start':'end');
}

function update(){
  const deg=parseFloat($('slider').value), th=deg*Math.PI/180;
  const s=Math.sin(th), c=Math.cos(th);
  $('angVal').textContent=deg.toFixed(1)+'°';
  const Bx=Cx+BC*s, By=Cy-BC*c;
  const AB=Math.hypot(Ax-Bx,Ay-By);

  // 杆、绳、重物
  $('rod').setAttribute('x2',Bx);$('rod').setAttribute('y2',By);
  $('rope2').setAttribute('x2',Bx);$('rope2').setAttribute('y2',By);
  $('wLine').setAttribute('x1',Bx);$('wLine').setAttribute('y1',By);
  $('wLine').setAttribute('x2',Bx);$('wLine').setAttribute('y2',By+42);
  $('wBox').setAttribute('x',Bx-17);$('wBox').setAttribute('y',By+42);
  $('wTxt').setAttribute('x',Bx+24);$('wTxt').setAttribute('y',By+66);
  $('lblB').setAttribute('x',Bx+12);$('lblB').setAttribute('y',By-10);

  // ∠BCA 弧
  $('arc').setAttribute('d',
    `M ${Cx} ${Cy-30} A 30 30 0 0 1 ${Cx+30*s} ${Cy-30*c}`);
  $('arcTxt').setAttribute('x',Cx+48*Math.sin(th/2)-14);
  $('arcTxt').setAttribute('y',Cy-48*Math.cos(th/2)+5);
  $('arcTxt').textContent=deg.toFixed(0)+'°';

  /* ---- 三个力：起点均为 B、沿真实方向（白衬线保证可见） ---- */
  const uxA=(Ax-Bx)/AB, uyA=(Ay-By)/AB;       // B→A（绳拉力 F 方向）
  const FL=S*AB/AC;
  const uxN=s, uyN=-c;                         // C→B（杆弹力 Fₙ 方向）
  const Gx2=Bx, Gy2=By+S;
  const Fx2=Bx+uxA*FL, Fy2=By+uyA*FL;
  const Nx2=Bx+uxN*NL, Ny2=By+uyN*NL;

  const setP=(id,x1,y1,x2,y2)=>{const l=$(id);
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);
    l.setAttribute('x2',x2);l.setAttribute('y2',y2);};
  setP('cG',Bx,By,Gx2,Gy2); setP('fG',Bx,By,Gx2,Gy2);
  $('fGt').setAttribute('x',Bx-12);$('fGt').setAttribute('y',By+36);
  setP('cT',Bx,By,Fx2,Fy2); setP('fT',Bx,By,Fx2,Fy2);
  const n1=nrm(-uyA,uxA);
  $('fTt').setAttribute('x',Fx2+n1[0]*16+(n1[0]>=0?2:-2));
  $('fTt').setAttribute('y',Fy2+n1[1]*16+4);
  $('fTt').setAttribute('text-anchor',n1[0]>=0?'start':'end');
  setP('cN',Bx,By,Nx2,Ny2); setP('fN',Bx,By,Nx2,Ny2);
  const n2=nrm(c,s);
  $('fNt').setAttribute('x',Nx2+n2[0]*16+(n2[0]>=0?2:-2));
  $('fNt').setAttribute('y',Ny2+n2[1]*16+4);

  /* ---- 平行四边形：G ⊕ Fₙ，对角线 R（= −F） ---- */
  const Px=Bx+uxN*NL, Py=By+S+uyN*NL;
  setP('pSide1',Gx2,Gy2,Px,Py);
  setP('pSide2',Nx2,Ny2,Px,Py);
  setP('pCas',Bx,By,Px,Py);
  setP('pDiag',Bx,By,Px,Py);
  $('pRt').setAttribute('x',Math.min(Px+8,800));
  $('pRt').setAttribute('y',Math.min(Py+18,812));

  /* ---- 右上：几何三角形 ABC ---- */
  const Ap=[720,120], Cp=[720,GY(Cy)], Bp=[GX(Bx),GY(By)];
  const gCtr=[(Ap[0]+Bp[0]+Cp[0])/3,(Ap[1]+Bp[1]+Cp[1])/3];
  setP('gAB',Ap[0],Ap[1],Bp[0],Bp[1]);
  setP('gBC',Bp[0],Bp[1],Cp[0],Cp[1]);
  vLabel($('gBt'),Bp,gCtr); vLabel($('gAt'),Ap,gCtr); vLabel($('gCt'),Cp,gCtr);
  eLabel($('gABt'),Ap,Bp,gCtr); $('gABt').textContent='AB='+Math.round(AB);
  eLabel($('gBCt'),Bp,Cp,gCtr); $('gBCt').textContent='BC='+BC;

  /* ---- 右下：力矢量三角形（与几何三角形相似） ---- */
  const V1=[PAx,V1y], PB=[PAx+NL*uxN, V1y+NL*uyN];
  const fCtr=[(PAx+V1[0]+PB[0])/3,(PAy+V1[1]+PB[1])/3];
  setP('pG',PAx,PAy,V1[0],V1[1]);
  setP('pN',V1[0],V1[1],PB[0],PB[1]);
  setP('pF',PB[0],PB[1],PAx,PAy);
  $('pGt').setAttribute('x',V1[0]+10);$('pGt').setAttribute('y',(PAy+V1y)/2+4);
  vLabel($('pNt'),PB,fCtr);
  eLabel($('pFt'),PB,[PAx,PAy],fCtr);

  // 数值代入
  $('ftVal1').textContent=`F = (AB/AC)·mg = ${(AB/AC).toFixed(2)} mg（随θ变化）`;
  $('ftVal2').textContent=`F\u2099 = (BC/AC)·mg = ${(BC/AC).toFixed(2)} mg（恒定）`;

  $('info').innerHTML=
    `∠BCA = ${deg.toFixed(1)}°　AB = ${Math.round(AB)} px（变化）　AC = 220 px、BC = 270 px（固定）<br>`+
    `绳拉力 <span class="ft">F = (AB/AC)·mg = ${(AB/AC).toFixed(2)} mg</span>（随 θ 变化）　　`+
    `杆弹力 <span class="fn">F<sub>N</sub> = (BC/AC)·mg = ${(BC/AC).toFixed(2)} mg</span>（恒定，杆受压）<br>`+
    `相似比：<b>G/AC = F/AB = F<sub>N</sub>/BC</b>　|　平行四边形：G 与 F<sub>N</sub> 为邻边，对角线 `+
    `<span style="color:#7a4fa0;font-weight:bold">R = G + F<sub>N</sub> = −F</span>（与 F 等大反向）→ 三力平衡，选 A`;
}

$('slider').addEventListener('input',update);
$('showF').addEventListener('change',e=>{
  const v=e.target.checked?'visible':'hidden';
  $('forces').setAttribute('visibility',v);
  $('ftri').setAttribute('visibility',v);
});

let timer=null;
$('play').addEventListener('click',()=>{
  if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 演示缓慢变小';return;}
  $('slider').value=140;update();
  timer=setInterval(()=>{
    let v=parseFloat($('slider').value)-0.4;
    if(v<=40){v=40;clearInterval(timer);timer=null;$('play').textContent='▶ 演示缓慢变小';}
    $('slider').value=v;update();
  },30);
});

update();
</script>
</body>
</html>
